<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Draft·in — logo preview</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0; min-height: 50vh; }
    .panel { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 48px; }
    .light { background: #FAFAFA; color: #0E0E10; }
    .dark  { background: #0E0E10; color: #FAFAFA; }
    .label { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.5; }
    .wordmark { width: min(420px, 80%); height: auto; }
    .wordmark-dark text:first-of-type { fill: #FAFAFA; }
    .icon { width: 96px; height: 96px; }
    .row-icons { display: flex; gap: 24px; align-items: center; }
    .icon-sm { width: 32px; height: 32px; }
    .icon-xs { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <div class="row">
    <div class="panel light">
      <div class="label">Wordmark — light</div>
      <object class="wordmark" type="image/svg+xml" data="logo.svg"></object>
      <div class="row-icons">
        <object class="icon"    type="image/svg+xml" data="icon.svg"></object>
        <object class="icon-sm" type="image/svg+xml" data="icon.svg"></object>
        <object class="icon-xs" type="image/svg+xml" data="icon.svg"></object>
      </div>
    </div>
    <div class="panel dark">
      <div class="label">Wordmark — dark</div>
      <svg class="wordmark wordmark-dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" role="img" aria-label="Draftin">
        <style>
          @import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@700;900&amp;display=swap');
          text { font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
        </style>
        <text x="2" y="72" font-size="84" font-weight="700" letter-spacing="-1.5" fill="#FAFAFA">Draft</text>
        <rect x="198" y="14" width="72" height="72" rx="14" ry="14" fill="#0A66C2"/>
        <text x="234" y="71" font-size="60" font-weight="900" letter-spacing="-2" fill="#FFFFFF" text-anchor="middle">in</text>
      </svg>
      <div class="row-icons">
        <object class="icon"    type="image/svg+xml" data="icon.svg"></object>
        <object class="icon-sm" type="image/svg+xml" data="icon.svg"></object>
        <object class="icon-xs" type="image/svg+xml" data="icon.svg"></object>
      </div>
    </div>
  </div>
</body>
</html>
